<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="login">
        <h1>Create your profile</h1>

       <p>Enter your credentials</p> 
       
       <h3>Enter your email</h3>
       <input type="text" name="Email" placeholder="example@gmail.com">
       
       <h3>Enter your password</h3>
       <input type="password" name="password" placeholder="xxxxxxxx">
       
       <br><br>
       
       <button>Login</button>
    </div>
    <script>
    function validatePassword() {
        const password = document.getElementById('password').value;
        const errorMessage = document.getElementById('password-error');
        
        const passwordPattern = /^(?=.*[0-9])(?=.*[!@#$%^&*]).{8,12}$/;
        
        if (password === '') {
            errorMessage.textContent = '❌ Password is required';
            return false;
        }
        
        if (!passwordPattern.test(password)) {
            errorMessage.textContent = '❌ Password must be 8-12 characters with at least 1 number and 1 special character';
            return false;
        }
        
        errorMessage.textContent = '✅ Password is valid!';
        errorMessage.style.color = 'green';
        alert('Login successful!');
        return true;
    }

    document.getElementById('password').addEventListener('input', function() {
        const password = this.value;
        const errorMessage = document.getElementById('password-error');
        const passwordPattern = /^(?=.*[0-9])(?=.*[!@#$%^&*]).{8,12}$/;
        
        if (password === '') {
            errorMessage.textContent = '';
            return;
        }
        
        if (!passwordPattern.test(password)) {
            errorMessage.textContent = '❌ Invalid password';
            errorMessage.style.color = 'red';
        } else {
            errorMessage.textContent = '✅ Password is valid!';
            errorMessage.style.color = 'green';
        }
    });
</script>
</body>
</html>
