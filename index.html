<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="login">
        <h1>Create your profile</h1>

       <p>Enter your credentials</p> 
       
       <h3>Enter your email</h3>
       <input type="text" name="Email" placeholder="example@gmail.com">
       
       <h3>Enter your password</h3>
       <input type="password" id="password" placeholder="xxxxxxxx">
       
       <br><br>
        <p id="password-error" class="error-message"></p>
<p class="password-requirements">
    Requirements: 8-12 characters, at least 1 number, at least 1 special character
</p>
       
       <button onclick="validatePassword()">Login</button>
        <a href="C:\Users\ossyd\Desktop\project\forms.html">Create an account</a>
    </div>
    <script>
    function validatePassword() {
        const password = document.getElementById('password').value;
        const errorMessage = document.getElementById('password-error');
        
        const passwordPattern = /^(?=.*[0-9])(?=.*[!@#$%^&*]).{8,12}$/;
        
        if (password === '') {
            errorMessage.textContent = '❌ Password is required';
            return false;
        }
        
        if (!passwordPattern.test(password)) {
            errorMessage.textContent = '❌ Password must be 8-12 characters with at least 1 number and 1 special character';
            return false;
        }
        
        errorMessage.textContent = '✅ Password is valid!';
        errorMessage.style.color = 'green';
        alert('Login successful!');
        return true;
    }
        function validatePassword() {
    const password = document.getElementById('password').value;
    const errorMessage = document.getElementById('password-error');
    
    const passwordPattern = /^(?=.*[0-9])(?=.*[!@#$%^&*]).{8,12}$/;
    
    if (password === '') {
        errorMessage.textContent = '❌ Password is required';
        errorMessage.style.display = 'block';
        return false;
    }
    
    if (!passwordPattern.test(password)) {
        errorMessage.textContent = '❌ Password must be 8-12 characters with at least 1 number and 1 special character';
        errorMessage.style.display = 'block';
        return false;
    }
    
    errorMessage.textContent = '✅ Password is valid!';
    errorMessage.style.color = 'green';
    errorMessage.style.display = 'block';
    
    alert('Login successful!');
    
    // CLEAR THE FORM
    document.getElementById('password').value = '';
    document.querySelector('input[name="Email"]').value = '';
    errorMessage.textContent = '';
    errorMessage.style.display = 'none';
    
    return true;
}

    document.getElementById('password').addEventListener('input', function() {
        const password = this.value;
        const errorMessage = document.getElementById('password-error');
        const passwordPattern = /^(?=.*[0-9])(?=.*[!@#$%^&*]).{8,12}$/;
        
        if (password === '') {
            errorMessage.textContent = '';
            return;
        }
        
        if (!passwordPattern.test(password)) {
            errorMessage.textContent = '❌ Invalid password';
            errorMessage.style.color = 'red';
        } else {
            errorMessage.textContent = '✅ Password is valid!';
            errorMessage.style.color = 'green';
        }
    });
</script>
    <a href="C:\Users\ossyd\Desktop\project\forms.html">Create an account</a>
</body>
</html>
